# Builds the Android APK (arm64-v8a, debug variant) in GitHub Actions with the repo's own ci/android image and
# tools/android_ci_run.sh (docs/android.md). Run it by hand: Actions > android > Run workflow.
# The APK is attached to the run as the artifact "p4pc-arm64-v8a-debug".
# Before building it patches the source so the Resolution setting also takes percentages from 50% up (scale:50% ... scale:800%).
# The debug variant installs as "P4PC Debug" (org.p4pc.game.debug) beside any other Persona 4 install:
# its own saves, settings and ISO grant. Its signing key lives in the cache below; if that cache is ever
# evicted the next build is signed with a new key and Android will refuse to update over the old install.
name: android

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    name: APK (arm64-v8a, debug)
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
      - name: Check the Java files were pasted completely
        run: |
          bad=0
          for f in P4Launcher PadOverlay P4Activity; do
            p=android/app/src/main/java/org/p4pc/game/$f.java
            open=$(tr -cd '{' < "$p" | wc -c)
            close=$(tr -cd '}' < "$p" | wc -c)
            if [ "$open" != "$close" ]; then
              echo "::error file=$p::$f.java is cut off ($open opening braces, $close closing). Replace its whole content again."
              bad=1
            fi
          done
          exit $bad
      - name: Resolution in percent (scale:50% to scale:800%)
        run: |
          python3 - <<'PY'
          import sys

          def edit(path, pairs):
              s = open(path).read()
              for old, new in pairs:
                  if s.count(old) != 1:
                      sys.exit("resolution patch: no unique match in %s for: %s" % (path, old.strip().splitlines()[0][:70]))
                  s = s.replace(old, new)
              open(path, "w").write(s)

          edit("src/platform/config/p4cfg.h", [(
          "    int scale;         /* scale:N parameter, 1 to 8; physical sizes need not be integer multiples */\n",
          "    int scale;         /* scale:N parameter, 1 to 8; physical sizes need not be integer multiples */\n"
          "    int scalePercent;  /* the scale as a percentage of the native sample grid: 100 times N for scale:N, or P (50 to 800) for scale:P% */\n")])

          edit("src/platform/config/p4cfg.c", [
          ("    video->resolution = P4CFG_RESOLUTION_SCALE;\n    video->scale = 1;\n    video->renderWidth = video->renderHeight = 0;\n",
           "    video->resolution = P4CFG_RESOLUTION_SCALE;\n    video->scale = 1;\n    video->scalePercent = 100;\n    video->renderWidth = video->renderHeight = 0;\n"),
          ("        if (v[6] >= '1' && v[6] <= '8' && end == v + 7 && resolutionEnd(end)) {\n            video->scale = (int)w;\n            return;\n        }\n",
           "        if (v[6] >= '1' && v[6] <= '8' && end == v + 7 && resolutionEnd(end)) {\n            video->scale = (int)w;\n            video->scalePercent = (int)w * 100;\n            return;\n        }\n"
           "        /* scale:P% is a percentage of the native sample grid, 50 to 800 */\n"
           "        if (v[6] >= '1' && v[6] <= '9' && *end == '%' && resolutionEnd(end + 1) && w >= 50 && w <= 800) {\n"
           "            video->scalePercent = (int)w;\n"
           "            video->scale = (int)w >= 100 ? (int)w / 100 : 1;\n"
           "            return;\n"
           "        }\n"),
          ("expected native, WxH (1..16384), or scale:1..8; using scale:1", "expected native, WxH (1..16384), scale:1..8 or scale:50%%..800%%; using scale:1"),
          ("video->resolution != P4CFG_RESOLUTION_SCALE || video->scale > 1 ||", "video->resolution != P4CFG_RESOLUTION_SCALE || video->scalePercent != 100 ||"),
          ("        video->scale = 1;\n    }\n}\n\nconst P4CfgVideo *p4cfg_video(void)", "        video->scale = 1;\n        video->scalePercent = 100;\n    }\n}\n\nconst P4CfgVideo *p4cfg_video(void)"),
          ])

          edit("src/render/p4gl_context.c", [
          ("        *w = p4gl_aspect_native_width() * (unsigned)video->scale;\n        *h = 448u * (unsigned)video->scale;\n",
           "        *w = (p4gl_aspect_native_width() * (unsigned)video->scalePercent + 50u) / 100u;\n        *h = (448u * (unsigned)video->scalePercent + 50u) / 100u;\n"),
          ("    else p4pc_ee_snprintf(out, capacity, \"scale:%d\", video->scale);\n",
           "    else if (video->scalePercent % 100 != 0) p4pc_ee_snprintf(out, capacity, \"scale:%d%c\", video->scalePercent, '%');\n    else p4pc_ee_snprintf(out, capacity, \"scale:%d\", video->scale);\n"),
          ("    static const char *const choices[] = {\"scale:1\", \"scale:2\", \"scale:3\", \"scale:4\",\n        \"scale:5\", \"scale:6\", \"scale:7\", \"scale:8\", \"native\", \"1366x768\",\n        \"1920x1080\", \"2560x1440\", \"3840x2160\"};\n",
           "    static const char *const choices[] = {\"scale:50%\", \"scale:60%\", \"scale:70%\", \"scale:75%\", \"scale:80%\", \"scale:90%\",\n        \"scale:1\", \"scale:125%\", \"scale:150%\", \"scale:175%\", \"scale:2\", \"scale:250%\", \"scale:3\", \"scale:4\",\n        \"scale:5\", \"scale:6\", \"scale:7\", \"scale:8\", \"native\", \"1366x768\",\n        \"1920x1080\", \"2560x1440\", \"3840x2160\"};\n"),
          ("    resolutionFormat(current, sizeof current, unused);\n    for (int i = 0; i < count; i++) if (strcmp(current, choices[i]) == 0) selected = i;\n",
           "    for (int i = 0; i < count; i++) if (resolutionSame(choices[i], \"scale:1\")) selected = i;\n    resolutionFormat(current, sizeof current, unused);\n    for (int i = 0; i < count; i++) if (resolutionSame(current, choices[i])) selected = i;\n"),
          ("static void resolutionAdjust(int direction, void *unused)\n{\n",
           "/* Not libc strcmp: with this many choices the compiler keeps a real strcmp call, which tools/crt_guard.py rejects in game-visible code. */\n"
           "static int resolutionSame(const char *a, const char *b)\n{\n    while (*a && *a == *b) { a++; b++; }\n    return *a == *b;\n}\n\n"
           "static void resolutionAdjust(int direction, void *unused)\n{\n"),
          ("(video->resolution == P4CFG_RESOLUTION_SCALE && video->scale == 1)", "(video->resolution == P4CFG_RESOLUTION_SCALE && video->scalePercent == 100)"),
          ])
          print("resolution percentages patched")
          PY
      - name: Build the Android image
        run: docker build -t p4pc-android ci/android
      - uses: actions/cache@v4
        with:
          path: .android-cache
          key: android-cache-${{ hashFiles('ci/android/**') }}-${{ github.run_id }}
          restore-keys: android-cache-${{ hashFiles('ci/android/**') }}-
      - uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-android-${{ github.run_id }}
          restore-keys: ccache-android-
      - name: Build the APK
        run: |
          mkdir -p .android-cache .ccache out
          code=0
          docker run --rm \
            -v "$PWD:/lane/src" -v "$PWD/out:/lane/out" \
            -v "$PWD/.android-cache:/android-cache" -v "$PWD/.ccache:/ccache" \
            -e P4PC_ANDROID_ABI=arm64-v8a -e P4PC_ANDROID_BUILD=debug \
            -e P4PC_ANDROID_VERSION_NAME="$(git describe --tags --always)" \
            -e P4PC_ANDROID_VERSION_CODE="$(git rev-list --count HEAD)" \
            p4pc-android sh -euc 'git config --global --add safe.directory "*"; sh /lane/src/tools/android_ci_run.sh' || code=$?
          echo "container exit code: $code"
          # The script's last step is an iOS syntax check that needs SDL headers an arm64-only build never makes, so it exits 1 even though
          # the APK was copied to out/ before it ran. Judge the build by the APK instead.
          test -f out/p4pc-arm64-v8a-debug.apk
      - name: Make the container's files readable for the cache and upload steps
        if: always()
        run: sudo chown -R "$USER" .android-cache .ccache out || true
      - uses: actions/upload-artifact@v4
        with:
          name: p4pc-arm64-v8a-debug
          path: out/p4pc-arm64-v8a-debug.apk
          if-no-files-found: error
          
